<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ravi Anand Kumar, Frontend Tech Lead</title>
  <meta name="description" content="I take frontends that have outgrown their structure and make them workable again. Frontend Tech Lead in Berlin." />
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="icon" type="image/x-icon" href="assets/favicon.svg">
  <!--
    Every page is prerendered as light-or-follow-the-OS HTML, so a visitor who
    chose a theme against their OS would see one frame of the wrong one before
    Angular hydrates. This runs before first paint and stamps the attribute the
    tokens key off. It deliberately writes nothing for "system", leaving the
    prefers-color-scheme media query in charge. ThemeService is the owner after
    hydration; this only closes the gap before it.
  -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
  <!--
    Site-wide identity, so search engines can tie the pages to one person rather
    than guessing. Static here rather than injected by the Seo service: it is the
    same on every route, and a script tag is awkward to manage through Angular's
    Meta service. Every field is checkable. jobTitle and the sameAs profiles match
    what /about and the footer already state, and there are no claims about
    employers or skills here that the pages do not make themselves.
  -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Ravi Anand Kumar",
      "jobTitle": "Frontend Tech Lead",
      "url": "https://ravianand1988.github.io/",
      "image": "https://ravianand1988.github.io/assets/photo.jpg",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Berlin",
        "addressCountry": "DE"
      },
      "knowsLanguage": ["en", "hi", "de"],
      "sameAs": [
        "https://www.linkedin.com/in/ravianandkumar/",
        "https://github.com/ravianand1988",
        "https://stackoverflow.com/users/2444505/ravi-anand"
      ]
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
