@if (post(); as entry) {
  <main class="wrap">
    <p class="eyebrow">{{ entry.pillar }} · {{ entry.date | date: 'MMMM y' }}</p>
    <h1>{{ entry.title }}</h1>
    <hr class="rule" />
    <article class="prose" [innerHTML]="body()"></article>
  </main>
} @else {
  <main class="wrap">
    <p class="eyebrow">404</p>
    <h1>That post is not here.</h1>
    <p><a href="/writing">See everything I have written</a></p>
  </main>
}
