<section id="skills" class="section">
  <p class="eyebrow">Skills</p>
  <h2>What I work with</h2>

  @for (g of groups; track $index) {
    <div class="group">
      <h3>{{ g.label }}</h3>
      <div class="tags">
        @for (s of g.skills; track $index) {
          <span class="tag">{{ s }}</span>
        }
      </div>
    </div>
  }
</section>
