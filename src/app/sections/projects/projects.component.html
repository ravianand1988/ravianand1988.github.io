<section id="projects" class="section section-alt">
  <p class="eyebrow">Projects</p>
  <h2>What I've been building</h2>

  @for (p of projects; track $index) {
    <div class="project-card card">
      <div class="project-header">
        <h3>{{ p.title }}</h3>
        @if (p.linkUrl) {
          <a class="btn" [href]="p.linkUrl" target="_blank" rel="noopener">{{ p.linkLabel }}</a>
        }
        @if (p.note && !p.linkUrl) {
          <span class="note">{{ p.note }}</span>
        }
      </div>
      <p>{{ p.description }}</p>
      <div class="stack">
        @for (s of p.stack; track $index) {
          <span class="tag">{{ s }}</span>
        }
      </div>
    </div>
  }

  <p class="more">
    <a href="https://github.com/ravianand1988" target="_blank" rel="noopener">See more on GitHub →</a>
  </p>
</section>
