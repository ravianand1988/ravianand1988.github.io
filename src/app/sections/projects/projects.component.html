<section id="projects" class="section section-alt">
  <p class="eyebrow">Projects</p>
  <h2>What I've been building</h2>

  <div class="project-card card" *ngFor="let p of projects">
    <div class="project-header">
      <h3>{{ p.title }}</h3>
      <a class="btn" *ngIf="p.linkUrl" [href]="p.linkUrl" target="_blank" rel="noopener">{{ p.linkLabel }}</a>
      <span class="note" *ngIf="p.note && !p.linkUrl">{{ p.note }}</span>
    </div>
    <p>{{ p.description }}</p>
    <div class="stack">
      <span class="tag" *ngFor="let s of p.stack">{{ s }}</span>
    </div>
  </div>

  <p class="more">
    <a href="https://github.com/ravianand1988" target="_blank" rel="noopener">See more on GitHub →</a>
  </p>
</section>
